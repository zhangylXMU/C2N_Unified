# =============================================================================
# C2N 锅炉侧替换方案 —— 输入参数（300 MW 亚临界再热机组）
#
# 用法：python run.py --config config/300MW_plant.toml
# 单位：温度 °C，压力 bar(a)，功率/热量 MW，流量 kg/s。
# =============================================================================

[plant]
turbine_class = "subcritical"
name = "300 MW 亚临界再热机组"

gross_power_mw = 300.0            # 汽轮机 100 % 工况毛电（发电机端）
gross_basis = "generator"         # 填铭牌时用 generator；轴功率用 shaft

main_steam_p_bar = 166.7          # 主蒸汽压力（与 600 MW 级同参数）
main_steam_t_c = 538.0            # 主蒸汽温度
main_steam_m_kgs = 240.000        # 主蒸汽流量（近似匹配 300 MWe 亚临界 THA）

cold_reheat_p_bar = 35.5          # 冷再热压力
cold_reheat_t_c = 312.000         # 冷再热温度
reheat_m_kgs = 200.500            # 再热蒸汽流量（扣除高加抽汽）
reheater_pressure_ratio = 0.889   # 冷再热 -> 热再热压比
hot_reheat_t_c = 538.0            # 热再热温度

drum_p_bar = 185.0                # 汽包压力（亚临界）
feedwater_p_bar = 200.0           # 给水压力（汽包 185 + 15 bar）
feedwater_t_c = 272.000           # 给水温度
economizer_subcooling_k = 5.0     # 省煤器出口过冷度

generator_eta = 0.988             # 仅 gross_basis = "shaft" 时使用
mechanical_eta = 0.995            # 同上

turbine_island_aux_mw = 13.5      # 汽轮机岛自用电（300 MW 级典型 ≈ 毛电 4.5 %）
boiler_aux_mw = 6.0               # 煤粉炉辅机自用电（300 MW 级典型 ≈ 毛电 2 %）

[reactor]
module_power_mwth = 250.0         # 单模块热功率
n_modules = 2                     # 2 × 250 MWth = 500 MWth（是否够见报告"堆功率够不够"）

t_hot_c = 750.0
t_ihx_out_c = 340.0
p_cold_bar = 70.0

core_pr = 0.98
ihx_pr = 0.98
eta_circulator = 0.85
eta_circulator_motor = 0.97

[salt]
fluid = "solar_salt"
t_hot_c = 565.0
optimise_split = true             # 支路份额由模型反解
main_branch_fraction = 0.825      # 仅 optimise_split = false 时生效
min_pinch_k = 5.0

p_bar = 3.0
pump_dp_bar = 2.0
eta_pump = 0.80
eta_pump_motor = 0.97

ua_margin = 1.0
u_superheater_w_m2k = 1000.0
u_evaporator_w_m2k = 2000.0
u_economizer_w_m2k = 1300.0
u_reheater_w_m2k = 1000.0
u_he_salt_w_m2k = 800.0
freezing_margin_k = 20.0          # 冷盐温度相对凝固点（238 °C）的最小裕量
t_warn_freeze_c = 220.0           # 变工况告警：盐最低温度低于此值 -> 凝固风险
t_warn_margin_c = 290.0           # 变工况告警：盐最低温度低于此值 -> 裕量不足

[storage]
hours = 4.0                       # 100 % 工况下储罐可维持 / 充满的小时数

# -----------------------------------------------------------------------------
# 设备尺寸估算（只影响"换热器多大、罐多大"，不影响热力结果）
# 这些是常规做法，按项目实际可改；尺寸误差约 ±30 %。
# -----------------------------------------------------------------------------
[sizing]
tube_od_mm = 25.0                 # 换热管外径
tube_wall_mm = 2.0                # 换热管壁厚
tube_length_m = 12.0              # 单根管长（立式壳管式 6~15 m）
pitch_ratio = 1.25                # 管间距/管外径（正三角形排列）
shell_clearance_m = 0.35          # 管束与壳体内壁间隙
max_shell_id_m = 4.0              # 单台壳体内径上限，超过则并联多台
tank_height_to_diameter = 0.4     # 储罐高径比 H/D（工业双罐 0.35~0.5，扁胖型）
ullage = 0.12                     # 储罐气相空间比例
salt_inventory_margin = 0.10      # 回路滞留盐量 / 储罐活动盐量

# -----------------------------------------------------------------------------
# 非额定工况估算（方案 B：不建模汽轮机通流）
#
# 只引入三条可标定的工程关系，其余（四台热负荷、辅机、储罐）都是精确计算。
# 下面默认值是亚临界再热机组的常规范围，**请用机组热力特性书替换**。
# -----------------------------------------------------------------------------
[partload]
# 要算的负荷点（相对汽轮机额定出力），从 1.0 递减
load_points = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3]

# 汽轮机循环效率相对额定的修正（与 load_points 一一对应）
# 只修正"级组效率 + 末级排汽损失 + 抽汽压力变化"，不含锅炉与辅机。
# 默认取自滑压运行机组的常规范围（50% 负荷热耗约差 7%，30% 差 13%）；
# 定压运行的机组请把后几点再压低 3~5 个百分点。
eta_ratio = [1.000, 0.992, 0.981, 0.967, 0.950, 0.930, 0.903, 0.870]

sliding_exponent = 0.90     # 滑压指数 k：p/p0 = (m/m0)^k（亚临界 0.85~1.0）
sliding_floor = 0.70        # 滑压下限（流量比），低于它转定压节流

# 汽轮机岛辅机随负荷怎么变：这个数是"其中不随负荷变化的比例"。
#   0.40 表示满负荷用满 turbine_island_aux_mw；50 % 负荷时约用 0.40+0.60×0.50 = 0.70（七成）。
#   循环水泵、辅机冷却水基本不随负荷变；给水泵、凝结水泵基本随流量变。
#   不确定就保持 0.40；若知道分项电耗，按"固定部分 ÷ 总辅机"填。
turbine_aux_fixed_fraction = 0.40   # 辅机中不随负荷变的比例（0~1）

# 给水温度随负荷（°C），与 load_points 一一对应（300 MW 级常规数据）
# 留空 [] = 不填，改为按"抽汽级数不变、抽汽压力随滑压比缩放"估算
feedwater_t_c = [272.0, 269.5, 266.0, 261.5, 256.0, 249.5, 241.5, 232.0]
