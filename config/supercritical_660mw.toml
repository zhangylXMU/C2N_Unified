# =============================================================================
# C2N_SCPP —— 超临界机组"锅炉侧替换"输入参数
#
# 用法：python run.py --config config/usc_1000mw.toml
# 单位：温度 °C，压力 bar(a)，功率/热量 MW，流量 kg/s。
#
# 与亚临界工具（C2N_CPP）的根本差别：没有汽包。
# 分段边界不是饱和温度，而是"省煤器出口"与"水冷壁出口"两个锅炉侧温度，
# 由业主从锅炉热力特性书（B-MCR / THA 热平衡图）里取。
# =============================================================================

[plant]
turbine_class = "ultra_supercritical"
name = "660 MW 超超临界机组"

gross_power_mw = 660.0           # 汽轮机 100 % 工况毛电（发电机端）
gross_basis = "generator"         # "generator" = 发电机端（填铭牌，推荐）

main_steam_p_bar = 265.0          # 主蒸汽压力（26.5 MPa）
main_steam_t_c = 600.0            # 主蒸汽温度
main_steam_m_kgs = 540.0          # 主蒸汽流量（直流锅炉 = 给水流量）

boiler_p_bar = 278.0              # 水冷壁出口压力（= 主蒸汽 + 过热器压损，必须 > 220.6）
wall_outlet_t_c = 450.0           # 水冷壁出口（= 蒸发段出口）温度
economizer_outlet_t_c = 340.0     # 省煤器出口温度（须低于该压力下的拟临界温度）

cold_reheat_p_bar = 55.0          # 冷再热压力
cold_reheat_t_c = 350.0           # 冷再热温度（高压缸排汽）
reheat_m_kgs = 440.0              # 再热蒸汽流量
reheater_pressure_ratio = 0.90    # 冷再热 -> 热再热压比
hot_reheat_t_c = 600.0            # 热再热温度

feedwater_p_bar = 300.0           # 给水压力（超临界给水泵出口通常 30~32 MPa）
feedwater_t_c = 298.0             # 给水温度（最终给水）

generator_eta = 0.988             # 仅 gross_basis = "shaft" 时使用
mechanical_eta = 0.995            # 同上

turbine_island_aux_mw = 30.0      # 汽轮机岛自用电（1000 MW 级典型 ≈ 毛电 4.5 %）
boiler_aux_mw = 13.0              # 煤粉炉辅机自用电（≈ 毛电 2 %），改造后消失

# -----------------------------------------------------------------------------
# 高温气冷堆（模块式）
# -----------------------------------------------------------------------------
[reactor]
module_power_mwth = 250.0
n_modules = 5                     # 660 MW 级 5 个模块（1250 MWth）

t_hot_c = 750.0
t_ihx_out_c = 340.0
p_cold_bar = 70.0

core_pr = 0.98
ihx_pr = 0.98
eta_circulator = 0.85
eta_circulator_motor = 0.97

# -----------------------------------------------------------------------------
# 熔盐回路（**新一代硝酸盐**：热物性与太阳盐相近，分解温度 650 °C）
# -----------------------------------------------------------------------------
[salt]
fluid = "advanced_nitrate"
t_hot_c = 620.0                   # 热罐温度（新盐上限 650，留 30 K 裕量）
optimise_split = true             # 把支路份额也反解（推荐）
main_branch_fraction = 0.825      # 仅 optimise_split = false 时生效
min_pinch_k = 5.0                 # 最小端差；冷盐温度按它反解

p_bar = 3.0
pump_dp_bar = 2.0
eta_pump = 0.80
eta_pump_motor = 0.97

ua_margin = 1.0
u_superheater_w_m2k = 900.0       # 超临界过热器（压力高、密度大，U 略低于亚临界）
u_evaporator_w_m2k = 2500.0       # 水冷壁（拟临界区 cp 极大，换热强）
u_economizer_w_m2k = 1300.0
u_reheater_w_m2k = 900.0
u_he_salt_w_m2k = 800.0
freezing_margin_k = 20.0
t_warn_freeze_c = 220.0           # 变工况告警：盐最低温度低于此值 -> 凝固风险
t_warn_margin_c = 290.0           # 变工况告警：盐最低温度低于此值 -> 裕量不足

# -----------------------------------------------------------------------------
# 储热
# -----------------------------------------------------------------------------
[storage]
hours = 4.0                       # 100 % 工况下储罐可维持（或充满）的小时数

# -----------------------------------------------------------------------------
# 设备尺寸估算（只影响"换热器多大、罐多大"，不影响热力结果）
# -----------------------------------------------------------------------------
[sizing]
tube_od_mm = 25.0
tube_wall_mm = 2.0
tube_length_m = 12.0
pitch_ratio = 1.25
shell_clearance_m = 0.35
max_shell_id_m = 4.0
tank_height_to_diameter = 0.4     # 工业双罐 0.35~0.5，扁胖型
ullage = 0.12
salt_inventory_margin = 0.10

# -----------------------------------------------------------------------------
# 非额定工况估算（不建模汽轮机通流）
# -----------------------------------------------------------------------------
[partload]
load_points = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3]

# 汽轮机循环效率相对额定的修正（与 load_points 一一对应）
# 超超临界滑压运行，50 % 负荷热耗约差 6~7 %，30 % 差 12~13 %
eta_ratio = [1.000, 0.993, 0.983, 0.970, 0.954, 0.935, 0.909, 0.876]

sliding_exponent = 0.90           # p/p0 = (m/m0)^k
sliding_floor = 0.70              # 滑压下限（流量比），低于它转定压节流

turbine_aux_fixed_fraction = 0.40 # 辅机中不随负荷变的比例

# 给水温度随负荷（°C），与 load_points 一一对应（1000 MW 级常规数据）
# 留空 [] = 不填，改为按"抽汽级数不变、抽汽压力随滑压比缩放"估算
feedwater_t_c = [296.0, 294.0, 291.0, 287.0, 282.0, 276.0, 268.0, 258.0]
